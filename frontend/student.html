<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CredentialChain</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>CredentialChain</h1>

  <div class="container">

    <!-- ISSUE CREDENTIAL -->
    <div class="card">
      <h3>Issue Credential</h3>
      <input id="studentName" placeholder="Student Name" />
      <input id="matricNo" placeholder="Matric Number" />
      <input id="course" placeholder="Course" />
      <input id="degree" placeholder="Degree" />
      <input id="year" placeholder="Year" type="number" />
      <button onclick="issueCredential()">Issue Credential</button>
      <a href="company.html">Verify Credential Here</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
