<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CredentialChain</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1>CredentialChain</h1>

  <div class="container">

    <!-- ISSUE CREDENTIAL -->
    <div class="card">
      <h3>Issue Credential</h3>
      <input id="studentName" placeholder="Student Name" />
      <input id="matricNo" placeholder="Matric Number" />
      <input id="course" placeholder="Course" />
      <input id="degree" placeholder="Degree" />
      <input id="year" placeholder="Year" />
      <button onclick="issueCredential()">Issue Credential</button>
    </div>

    <!-- MINE BLOCK -->
    <div class="card">
      <h3>Mine Block</h3>
      <button onclick="mineBlock()">Mine</button>
    </div>

    <!-- VERIFY CREDENTIAL -->
    <div class="card">
      <h3>Verify Credential</h3>
      <input id="verifyMatric" placeholder="Matric Number" />
      <button onclick="verifyCredential()">Verify</button>
    </div>

    <!-- RESULT OUTPUT -->
    <pre id="result"></pre>

  </div>

  <script src="app.js"></script>
</body>
</html>
